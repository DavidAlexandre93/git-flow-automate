name: Git Flow Automation

on:
  pull_request:
    types:
      - closed
    branches:
      - develop
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-from-develop-merge:
    name: Create ${{ matrix.title_prefix }} branch and PR
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'develop' &&
      (
        startsWith(github.event.pull_request.head.ref, 'feature/') ||
        startsWith(github.event.pull_request.head.ref, 'bugfix/')
      )
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch_prefix: release
            title_prefix: Release
            fallback_message: Release criada
          - branch_prefix: release-candidate
            title_prefix: Release Candidate
            fallback_message: Release candidate criada

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare release metadata
        id: release
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          SOURCE_PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_PR_TITLE: ${{ github.event.pull_request.title }}
          TARGET_BRANCH_PREFIX: ${{ matrix.branch_prefix }}
          TARGET_TITLE_PREFIX: ${{ matrix.title_prefix }}
        run: |
          source_branch="$SOURCE_BRANCH"
          source_type="${source_branch%%/*}"
          source_name="${source_branch#*/}"

          if [ "$source_name" = "$source_branch" ]; then
            source_name="$source_branch"
          fi

          safe_name="$(echo "$source_name" \
            | tr '[:upper:] ' '[:lower:]-' \
            | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^-//; s/-$//')"

          if [ -z "$safe_name" ]; then
            safe_name="$source_type-$SOURCE_PR_NUMBER"
          fi

          {
            echo "source_name=$source_name"
            echo "target_branch=$TARGET_BRANCH_PREFIX/$safe_name"
            echo "target_title=$TARGET_TITLE_PREFIX: $SOURCE_PR_TITLE"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update ${{ matrix.title_prefix }} branch
        shell: bash
        run: |
          target_branch="${{ steps.release.outputs.target_branch }}"

          git fetch origin "+refs/heads/develop:refs/remotes/origin/develop"

          if git ls-remote --exit-code --heads origin "$target_branch" >/dev/null 2>&1; then
            git fetch origin "+refs/heads/$target_branch:refs/remotes/origin/$target_branch"
            git checkout -B "$target_branch" "origin/$target_branch"
            git merge --no-edit origin/develop
          else
            git checkout -b "$target_branch" origin/develop
          fi

          git push origin "$target_branch"

      - name: Create or update ${{ matrix.title_prefix }} PR to main
        uses: actions/github-script@v7
        env:
          TARGET_BRANCH: ${{ steps.release.outputs.target_branch }}
          TARGET_TITLE: ${{ steps.release.outputs.target_title }}
          FALLBACK_MESSAGE: ${{ matrix.fallback_message }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const targetBranch = process.env.TARGET_BRANCH;
            const targetTitle = process.env.TARGET_TITLE;
            const fallbackMessage = process.env.FALLBACK_MESSAGE;
            const sourcePr = context.payload.pull_request;
            const body = sourcePr.body || `${fallbackMessage} a partir de ${sourcePr.head.ref}.`;

            const existingPulls = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: 'main',
              head: `${owner}:${targetBranch}`,
            });

            if (existingPulls.data.length > 0) {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: existingPulls.data[0].number,
                title: targetTitle,
                body,
              });

              core.info(`${targetTitle} PR atualizado: #${existingPulls.data[0].number}`);
              return;
            }

            const createdPull = await github.rest.pulls.create({
              owner,
              repo,
              title: targetTitle,
              body,
              head: targetBranch,
              base: 'main',
            });

            core.info(`${targetTitle} PR criado: #${createdPull.data.number}`);

  create-merge-back-from-hotfix:
    name: Create merge back PR to develop
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'hotfix/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare merge back metadata
        id: merge_back
        shell: bash
        env:
          HOTFIX_BRANCH: ${{ github.event.pull_request.head.ref }}
          HOTFIX_PR_NUMBER: ${{ github.event.pull_request.number }}
          HOTFIX_PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          hotfix_branch="$HOTFIX_BRANCH"
          hotfix_name="${hotfix_branch#hotfix/}"
          safe_name="$(echo "$hotfix_name" \
            | tr '[:upper:] ' '[:lower:]-' \
            | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^-//; s/-$//')"

          if [ -z "$safe_name" ]; then
            safe_name="hotfix-$HOTFIX_PR_NUMBER"
          fi

          {
            echo "hotfix_name=$hotfix_name"
            echo "merge_back_branch=merge-back/$safe_name"
            echo "merge_back_title=Merge back: $HOTFIX_PR_TITLE"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update merge back branch
        shell: bash
        run: |
          merge_back_branch="${{ steps.merge_back.outputs.merge_back_branch }}"

          git fetch origin "+refs/heads/main:refs/remotes/origin/main"

          if git ls-remote --exit-code --heads origin "$merge_back_branch" >/dev/null 2>&1; then
            git fetch origin "+refs/heads/$merge_back_branch:refs/remotes/origin/$merge_back_branch"
            git checkout -B "$merge_back_branch" "origin/$merge_back_branch"
            git merge --no-edit origin/main
          else
            git checkout -b "$merge_back_branch" origin/main
          fi

          git push origin "$merge_back_branch"

      - name: Create or update merge back PR to develop
        uses: actions/github-script@v7
        env:
          MERGE_BACK_BRANCH: ${{ steps.merge_back.outputs.merge_back_branch }}
          MERGE_BACK_TITLE: ${{ steps.merge_back.outputs.merge_back_title }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const mergeBackBranch = process.env.MERGE_BACK_BRANCH;
            const mergeBackTitle = process.env.MERGE_BACK_TITLE;
            const hotfixPr = context.payload.pull_request;
            const body = hotfixPr.body || `Merge back criado a partir do hotfix ${hotfixPr.head.ref}.`;

            const existingPulls = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: 'develop',
              head: `${owner}:${mergeBackBranch}`,
            });

            if (existingPulls.data.length > 0) {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: existingPulls.data[0].number,
                title: mergeBackTitle,
                body,
              });

              core.info(`Merge back PR atualizado: #${existingPulls.data[0].number}`);
              return;
            }

            const createdPull = await github.rest.pulls.create({
              owner,
              repo,
              title: mergeBackTitle,
              body,
              head: mergeBackBranch,
              base: 'develop',
            });

            core.info(`Merge back PR criado: #${createdPull.data.number}`);
