name: Git Flow Automation

on:
  pull_request:
    types:
      - closed
    branches:
      - develop
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-from-feature:
    name: Create release branch and PR
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'develop' &&
      startsWith(github.event.pull_request.head.ref, 'feature/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare release metadata
        id: release
        shell: bash
        env:
          FEATURE_BRANCH: ${{ github.event.pull_request.head.ref }}
          FEATURE_PR_NUMBER: ${{ github.event.pull_request.number }}
          FEATURE_PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          feature_branch="$FEATURE_BRANCH"
          feature_name="${feature_branch#feature/}"
          safe_name="$(echo "$feature_name" \
            | tr '[:upper:] ' '[:lower:]-' \
            | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^-//; s/-$//')"

          if [ -z "$safe_name" ]; then
            safe_name="feature-$FEATURE_PR_NUMBER"
          fi

          {
            echo "feature_name=$feature_name"
            echo "release_branch=release/$safe_name"
            echo "release_title=Release: $FEATURE_PR_TITLE"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update release branch
        shell: bash
        run: |
          release_branch="${{ steps.release.outputs.release_branch }}"

          git fetch origin "+refs/heads/develop:refs/remotes/origin/develop"

          if git ls-remote --exit-code --heads origin "$release_branch" >/dev/null 2>&1; then
            git fetch origin "+refs/heads/$release_branch:refs/remotes/origin/$release_branch"
            git checkout -B "$release_branch" "origin/$release_branch"
            git merge --no-edit origin/develop
          else
            git checkout -b "$release_branch" origin/develop
          fi

          git push origin "$release_branch"

      - name: Create or update release PR to main
        uses: actions/github-script@v7
        env:
          RELEASE_BRANCH: ${{ steps.release.outputs.release_branch }}
          RELEASE_TITLE: ${{ steps.release.outputs.release_title }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const releaseBranch = process.env.RELEASE_BRANCH;
            const releaseTitle = process.env.RELEASE_TITLE;
            const featurePr = context.payload.pull_request;
            const body = featurePr.body || `Release criada a partir da feature ${featurePr.head.ref}.`;

            const existingPulls = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: 'main',
              head: `${owner}:${releaseBranch}`,
            });

            if (existingPulls.data.length > 0) {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: existingPulls.data[0].number,
                title: releaseTitle,
                body,
              });

              core.info(`Release PR atualizado: #${existingPulls.data[0].number}`);
              return;
            }

            const createdPull = await github.rest.pulls.create({
              owner,
              repo,
              title: releaseTitle,
              body,
              head: releaseBranch,
              base: 'main',
            });

            core.info(`Release PR criado: #${createdPull.data.number}`);

  create-merge-back-from-hotfix:
    name: Create merge back PR to develop
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'hotfix/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare merge back metadata
        id: merge_back
        shell: bash
        env:
          HOTFIX_BRANCH: ${{ github.event.pull_request.head.ref }}
          HOTFIX_PR_NUMBER: ${{ github.event.pull_request.number }}
          HOTFIX_PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          hotfix_branch="$HOTFIX_BRANCH"
          hotfix_name="${hotfix_branch#hotfix/}"
          safe_name="$(echo "$hotfix_name" \
            | tr '[:upper:] ' '[:lower:]-' \
            | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^-//; s/-$//')"

          if [ -z "$safe_name" ]; then
            safe_name="hotfix-$HOTFIX_PR_NUMBER"
          fi

          {
            echo "hotfix_name=$hotfix_name"
            echo "merge_back_branch=merge-back/$safe_name"
            echo "merge_back_title=Merge back: $HOTFIX_PR_TITLE"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update merge back branch
        shell: bash
        run: |
          merge_back_branch="${{ steps.merge_back.outputs.merge_back_branch }}"

          git fetch origin "+refs/heads/main:refs/remotes/origin/main"

          if git ls-remote --exit-code --heads origin "$merge_back_branch" >/dev/null 2>&1; then
            git fetch origin "+refs/heads/$merge_back_branch:refs/remotes/origin/$merge_back_branch"
            git checkout -B "$merge_back_branch" "origin/$merge_back_branch"
            git merge --no-edit origin/main
          else
            git checkout -b "$merge_back_branch" origin/main
          fi

          git push origin "$merge_back_branch"

      - name: Create or update merge back PR to develop
        uses: actions/github-script@v7
        env:
          MERGE_BACK_BRANCH: ${{ steps.merge_back.outputs.merge_back_branch }}
          MERGE_BACK_TITLE: ${{ steps.merge_back.outputs.merge_back_title }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const mergeBackBranch = process.env.MERGE_BACK_BRANCH;
            const mergeBackTitle = process.env.MERGE_BACK_TITLE;
            const hotfixPr = context.payload.pull_request;
            const body = hotfixPr.body || `Merge back criado a partir do hotfix ${hotfixPr.head.ref}.`;

            const existingPulls = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: 'develop',
              head: `${owner}:${mergeBackBranch}`,
            });

            if (existingPulls.data.length > 0) {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: existingPulls.data[0].number,
                title: mergeBackTitle,
                body,
              });

              core.info(`Merge back PR atualizado: #${existingPulls.data[0].number}`);
              return;
            }

            const createdPull = await github.rest.pulls.create({
              owner,
              repo,
              title: mergeBackTitle,
              body,
              head: mergeBackBranch,
              base: 'develop',
            });

            core.info(`Merge back PR criado: #${createdPull.data.number}`);
