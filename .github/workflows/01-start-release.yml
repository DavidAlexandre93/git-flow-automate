name: 01 - Start Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: Release branch description, for example login-flow
        required: true
        type: string
      version:
        description: Optional version for the first release candidate, for example 1.4.0. If empty, README.md is used.
        required: false
        type: string
      rc_number:
        description: First release candidate number
        required: false
        default: "1"
        type: string
  pull_request:
    types:
      - closed
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  start-release:
    name: Start release
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'develop' &&
        (
          startsWith(github.event.pull_request.head.ref, 'feature/') ||
          startsWith(github.event.pull_request.head.ref, 'bugfix/')
        )
      )
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      release_branch: ${{ steps.release.outputs.branch }}
      rc_number: ${{ steps.release.outputs.rc_number }}

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare release metadata
        id: release
        shell: bash
        env:
          RELEASE_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.release_name || '' }}
          VERSION_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          RC_NUMBER_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.rc_number || '1' }}
          SOURCE_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || '' }}
          SOURCE_TITLE: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || '' }}
        run: |
          release_name="$(echo "$RELEASE_NAME" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"

          if [ -z "$release_name" ]; then
            release_name="${SOURCE_BRANCH#*/}"
          fi

          if [ -z "$release_name" ] || [ "$release_name" = "$SOURCE_BRANCH" ]; then
            release_name="$SOURCE_TITLE"
          fi

          safe_name="$(echo "$release_name" \
            | tr '[:upper:] ' '[:lower:]-' \
            | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^-//; s/-$//')"

          if [ -z "$safe_name" ]; then
            echo "::error::Release name could not be derived from the merged branch or PR title."
            exit 1
          fi

          version="$(echo "$VERSION_INPUT" | tr -d '[:space:]')"
          version="${version#v}"

          if [ -z "$version" ]; then
            version="$(sed -nE 's/.*v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' README.md | head -n 1)"
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use the X.Y.Z format, for example 1.4.0. Provide it manually or keep a vX.Y.Z entry in README.md."
            exit 1
          fi

          rc_number="$(echo "$RC_NUMBER_INPUT" | tr -d '[:space:]')"

          if [ -z "$rc_number" ]; then
            rc_number="1"
          fi

          if ! [[ "$rc_number" =~ ^[0-9]+$ ]]; then
            echo "::error::Release candidate number must be an integer, for example 1."
            exit 1
          fi

          {
            echo "name=$release_name"
            echo "branch=release/$safe_name"
            echo "title=Release: $release_name"
            echo "version=$version"
            echo "rc_number=$rc_number"
            echo "rc_tag=v$version-rc.$rc_number"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure no other active release exists
        uses: actions/github-script@v7
        env:
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
        with:
          github-token: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
          script: |
            const { owner, repo } = context.repo;
            const releaseBranch = process.env.RELEASE_BRANCH;
            const releaseBranchPattern = /^release\/.+$/;

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: 'main',
              per_page: 100,
            });

            const activeReleasePulls = pulls
              .filter((pull) => pull.head.repo?.full_name === `${owner}/${repo}`)
              .filter((pull) => releaseBranchPattern.test(pull.head.ref));

            const otherActiveRelease = activeReleasePulls
              .find((pull) => pull.head.ref !== releaseBranch);

            if (otherActiveRelease) {
              core.setFailed(
                `Active release ${otherActiveRelease.head.ref} is already open in PR #${otherActiveRelease.number}. ` +
                `Close or finish it before starting ${releaseBranch}.`
              );
              return;
            }

            core.info('No other active release found.');

      - name: Create release branch
        shell: bash
        run: |
          release_branch="${{ steps.release.outputs.branch }}"

          git fetch origin "+refs/heads/develop:refs/remotes/origin/develop"

          if git ls-remote --exit-code --heads origin "$release_branch" >/dev/null 2>&1; then
            echo "::notice::Release branch $release_branch already exists. Keeping its current contents."
            git fetch origin "+refs/heads/$release_branch:refs/remotes/origin/$release_branch"
            git checkout -B "$release_branch" "origin/$release_branch"
          else
            git checkout -b "$release_branch" origin/develop
            git push origin "$release_branch"
          fi

      - name: Create or update draft PR to main
        uses: actions/github-script@v7
        env:
          RELEASE_NAME: ${{ steps.release.outputs.name }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        with:
          github-token: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
          script: |
            const { owner, repo } = context.repo;
            const releaseName = process.env.RELEASE_NAME;
            const releaseBranch = process.env.RELEASE_BRANCH;
            const title = process.env.RELEASE_TITLE;
            const sourcePr = context.payload.pull_request;
            const body = sourcePr?.body || [
              `Release ${releaseName} cut from develop.`,
              '',
              'This draft PR represents the stabilization window for this version.',
              'Only fixes for this version should be added to the release branch.'
            ].join('\n');

            const existingPulls = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: 'main',
              head: `${owner}:${releaseBranch}`,
            });

            if (existingPulls.data.length > 0) {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: existingPulls.data[0].number,
                title,
                body,
              });

              core.info(`Release PR updated: #${existingPulls.data[0].number}`);
              return;
            }

            const createdPull = await github.rest.pulls.create({
              owner,
              repo,
              title,
              body,
              head: releaseBranch,
              base: 'main',
              draft: true,
            });

            core.info(`Release draft PR created: #${createdPull.data.number}`);

  create-initial-release-candidate:
    name: Create initial release candidate
    needs: start-release
    uses: ./.github/workflows/02-create-release-candidate.yml
    with:
      version: ${{ needs.start-release.outputs.version }}
      release_branch: ${{ needs.start-release.outputs.release_branch }}
      rc_number: ${{ needs.start-release.outputs.rc_number }}
    secrets: inherit
