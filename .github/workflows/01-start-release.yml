name: 01 - Start Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to cut from develop, for example 1.4.0
        required: true
        type: string
  pull_request:
    types:
      - closed
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  start-release:
    name: Start release
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'develop' &&
        (
          startsWith(github.event.pull_request.head.ref, 'feature/') ||
          startsWith(github.event.pull_request.head.ref, 'bugfix/')
        )
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare release metadata
        id: release
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: |
          version="$(echo "$VERSION" | tr -d '[:space:]')"

          if [ -z "$version" ]; then
            version="$(grep -Eo 'v?[0-9]+\.[0-9]+\.[0-9]+' README.md \
              | head -n 1 \
              | sed 's/^v//')"
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use the X.Y.Z format, for example 1.4.0. For automatic releases, README.md must contain a version like v1.4.0."
            exit 1
          fi

          {
            echo "version=$version"
            echo "branch=release/$version"
            echo "title=Release: $version"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure no other active release exists
        uses: actions/github-script@v7
        env:
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
        with:
          github-token: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
          script: |
            const { owner, repo } = context.repo;
            const releaseBranch = process.env.RELEASE_BRANCH;
            const releaseBranchPattern = /^release\/\d+\.\d+\.\d+$/;

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: 'main',
              per_page: 100,
            });

            const activeReleasePulls = pulls
              .filter((pull) => pull.head.repo?.full_name === `${owner}/${repo}`)
              .filter((pull) => releaseBranchPattern.test(pull.head.ref));

            const otherActiveRelease = activeReleasePulls
              .find((pull) => pull.head.ref !== releaseBranch);

            if (otherActiveRelease) {
              core.setFailed(
                `Active release ${otherActiveRelease.head.ref} is already open in PR #${otherActiveRelease.number}. ` +
                `Close or finish it before starting ${releaseBranch}.`
              );
              return;
            }

            core.info('No other active release found.');

      - name: Create release branch
        shell: bash
        run: |
          release_branch="${{ steps.release.outputs.branch }}"

          git fetch origin "+refs/heads/develop:refs/remotes/origin/develop"

          if git ls-remote --exit-code --heads origin "$release_branch" >/dev/null 2>&1; then
            echo "::notice::Release branch $release_branch already exists. Keeping its current contents."
            git fetch origin "+refs/heads/$release_branch:refs/remotes/origin/$release_branch"
            git checkout -B "$release_branch" "origin/$release_branch"
          else
            git checkout -b "$release_branch" origin/develop
            git push origin "$release_branch"
          fi

      - name: Create or update draft PR to main
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
          script: |
            const { owner, repo } = context.repo;
            const version = '${{ steps.release.outputs.version }}';
            const releaseBranch = '${{ steps.release.outputs.branch }}';
            const title = '${{ steps.release.outputs.title }}';
            const body = [
              `Release ${version} cut from develop.`,
              '',
              'This draft PR represents the stabilization window for this version.',
              'Only fixes for this version should be added to the release branch.'
            ].join('\n');

            const existingPulls = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: 'main',
              head: `${owner}:${releaseBranch}`,
            });

            if (existingPulls.data.length > 0) {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: existingPulls.data[0].number,
                title,
                body,
              });

              core.info(`Release PR updated: #${existingPulls.data[0].number}`);
              return;
            }

            const createdPull = await github.rest.pulls.create({
              owner,
              repo,
              title,
              body,
              head: releaseBranch,
              base: 'main',
              draft: true,
            });

            core.info(`Release draft PR created: #${createdPull.data.number}`);
